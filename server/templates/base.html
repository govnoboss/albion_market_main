<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GBot Admin{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    {% block head %}{% endblock %}
</head>

<body>
    {% if session_active %}
    <nav class="navbar">
        <div class="nav-brand">🤖 GBot Admin</div>
        <div class="nav-links">
            <a href="/admin/" class="nav-link">Дашборд</a>
            <a href="/admin/stats" class="nav-link">Статистика</a>
            <a href="/admin/licenses" class="nav-link">Ключи</a>
            <a href="/admin/generate" class="nav-link">Создать</a>
            <a href="/admin/logout" class="nav-link logout">Выход</a>
        </div>
    </nav>
    {% endif %}

    <main class="container">
        {% if message %}
        <div class="alert alert-{{ message_type }}">{{ message }}</div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>

</html>
